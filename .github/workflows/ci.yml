name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Starship for integration tests
        run: |
          curl -fsSL https://github.com/starship/starship/releases/download/v1.26.0/starship-x86_64-unknown-linux-musl.tar.gz -o /tmp/starship.tar.gz
          tar -xzf /tmp/starship.tar.gz -C "$HOME/.cargo/bin" starship
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
