[package]
name = "starship-worktrunk"
version = "0.1.0"
edition = "2024"
authors = ["Faria"]
description = "A Starship custom module that compacts Worktrunk branch suffixes in directory paths."
license = "MIT"
repository = "https://github.com/Faria22/starship-worktrunk"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["starship", "prompt", "worktrunk", "git", "cli"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
